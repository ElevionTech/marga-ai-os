# Local MARGA deployment. Builds this checkout and binds only to loopback.
# Set MARGA_SETUP_TOKEN in a private .env file before first start.
services:
  marga:
    build:
      context: .
      args:
        CLAUDE_CLI_VERSION: ${CLAUDE_CLI_VERSION:-latest}
    image: marga-ai-os:local
    pull_policy: build
    container_name: ${MARGA_NAME:-marga-ai-os}
    restart: unless-stopped
    environment:
      JAVIS_STATE_DIR: /data/state
      MARGA_STATE_DIR: /data/state
      JAVIS_REQUIRE_LOGIN: "1"
      BRAINS_DIR: /brains
      BRAIN_PATH: /data/brain
      OBSIDIAN_VAULT_PATH: /data/vault
      MARGA_SETUP_TOKEN: ${MARGA_SETUP_TOKEN:?Set a unique MARGA_SETUP_TOKEN in .env}
      JAVIS_ADMIN_USER: ${MARGA_ADMIN_USER:-}
      JAVIS_ADMIN_PASSWORD: ${MARGA_ADMIN_PASSWORD:-}
    ports:
      - "127.0.0.1:${MARGA_HOST_PORT:-7777}:7777"
    volumes:
      - marga-state:/data
      - marga-brains:/brains
      - marga-claude-auth:/home/javis/.claude
      - marga-codex-auth:/home/javis/.codex
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:7777/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  marga-state:
  marga-brains:
  marga-claude-auth:
  marga-codex-auth:
